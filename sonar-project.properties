sonar.projectKey=sgi
sonar.projectName=Sistema de Gestion de Incidencias Georreferenciadas
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

sonar.sources=backend/app,backend/bootstrap,backend/config,backend/database,backend/resources,backend/routes,frontend/app
sonar.tests=backend/tests

sonar.exclusions=**/.env,**/.env.*,**/vendor/**,**/node_modules/**,backend/storage/**,backend/bootstrap/cache/**,backend/public/build/**,backend/database/seeders/data/**,backend/resources/views/scribe/**,backend/resources/views/vendor/mail/html/*.blade.php,backend/resources/views/vendor/mail/html/themes/default.css,backend/resources/views/vendor/mail/text/*.blade.php,frontend/app/img/**,frontend/plugins/**,frontend/dist/**,frontend/build/**,frontend/docs/**,frontend/docs_html/**,**/*.min.js,**/*.min.css,**/*.map,**/build/logs/**,docs/e6/logs/**,docs/e6/reportes/**,**/.scannerwork/**,**/.sonar/**,**/*.log,**/coverage/**
sonar.test.exclusions=backend/tests/**/Fixtures/**,backend/tests/**/fixtures/**
sonar.coverage.exclusions=backend/bootstrap/**,backend/config/**,backend/database/factories/**,backend/database/migrations/**,backend/database/seeders/**,backend/resources/views/**,backend/routes/**,frontend/app/css/**,frontend/app/html/**,frontend/app/js/**/presentation/**
sonar.cpd.exclusions=backend/database/migrations/**,backend/database/seeders/**,frontend/app/**/*.min.js,frontend/app/**/*.min.css,frontend/app/**/*.html,frontend/app/*.html

sonar.php.coverage.reportPaths=backend/build/logs/clover.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.php.tests.reportPath=backend/build/logs/junit.xml
sonar.working.directory=/tmp/sonar-scanner-work
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300


# Ignore Web:S5725 (missing integrity on script/link tags) in HTML files
sonar.issue.ignore.multicriteria.e1.ruleKey=Web:S5725
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.html

# Ignore Web:S6842 (interactive roles on non-interactive elements) in HTML files due to Bootstrap 4 markup
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e2.ruleKey=Web:S6842
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.html

# Ignore Web:S6819 (role vs native element) in HTML files due to Bootstrap 4 modal markup
sonar.issue.ignore.multicriteria.e3.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.html


