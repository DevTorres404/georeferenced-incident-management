name: incident-management-backend

services:
    pgsql:
        image: 'postgis/postgis:16-3.4-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE:-incident_management}'
            POSTGRES_USER: '${DB_USERNAME:-sail}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'incident-management-backend-pgsql:/var/lib/postgresql/data'
        networks:
            - backend
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE:-incident_management}'
                - '-U'
                - '${DB_USERNAME:-sail}'
            retries: 3
            timeout: 5s

    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'incident-management-backend-redis:/data'
        networks:
            - backend
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s

    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - backend

    rustfs:
        image: 'rustfs/rustfs:latest'
        ports:
            - '${FORWARD_RUSTFS_PORT:-9000}:9000'
            - '${FORWARD_RUSTFS_CONSOLE_PORT:-9001}:9001'
        environment:
            RUSTFS_ADDRESS: ':9000'
            RUSTFS_CONSOLE_ENABLE: 'true'
            RUSTFS_CONSOLE_ADDRESS: ':9001'
            RUSTFS_ACCESS_KEY: '${RUSTFS_ACCESS_KEY_ID:-rustfsadmin}'
            RUSTFS_SECRET_KEY: '${RUSTFS_SECRET_ACCESS_KEY:-rustfsadmin123}'
            RUSTFS_REGION: '${RUSTFS_REGION:-us-east-1}'
        volumes:
            - 'incident-management-backend-rustfs:/data'
        networks:
            - backend

    rustfs-init:
        image: 'minio/mc:latest'
        depends_on:
            - rustfs
        entrypoint: >
            /bin/sh -c "
            until mc alias set rustfs http://rustfs:9000 '${RUSTFS_ACCESS_KEY_ID:-rustfsadmin}' '${RUSTFS_SECRET_ACCESS_KEY:-rustfsadmin123}'; do sleep 2; done;
            mc mb --ignore-existing rustfs/${RUSTFS_BUCKET:-sgi-incidents};
            "
        networks:
            - backend

networks:
    backend:
        driver: bridge

volumes:
    incident-management-backend-pgsql:
        driver: local
    incident-management-backend-redis:
        driver: local
    incident-management-backend-rustfs:
        driver: local
