<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SGI | Gestion territorial</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <link rel="stylesheet" href="../../plugins/fontawesome-free/css/all.min.css">
  <link rel="stylesheet" href="../../plugins/overlayScrollbars/css/OverlayScrollbars.min.css">
  <link rel="stylesheet" href="../../dist/css/adminlte.min.css">
  <link rel="stylesheet" href="../css/app.css?v=29">
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">
  <div id="alertaGlobal" role="alert"></div>
  <nav class="main-header navbar navbar-expand navbar-white navbar-light" id="mainNavbar"></nav>

  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a href="dashboard.html" class="brand-link bg-transparent border-0 d-flex align-items-center" style="padding: 10px 15px;">
      <img src="../img/SGI_LOGO.png" alt="SGI Logo" class="brand-image" style="opacity: .9; border-radius: 4px; object-fit: contain; width: 35px; height: 35px; background-color: white;">
      <span class="brand-text font-weight-bold ml-2 text-white" style="letter-spacing: 1px;">SGI</span>
    </a>
    <div id="mainSidebar"></div>
  </aside>

  <div class="content-wrapper">
    <div id="pageLoader" class="spinner-overlay" role="status" aria-live="polite">
      <div class="loader-orbit" aria-hidden="true">
        <i class="fas fa-map-marker-alt"></i>
      </div>
    </div>

    <div class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-8">
            <h1 class="m-0 text-main font-weight-bold">
              <i class="fas fa-sitemap text-primary mr-2"></i>Gestion territorial
            </h1>
            <p class="text-muted mb-0 mt-1" style="font-size: 0.9rem;">Administra provincias, cantones, parroquias y sectores.</p>
          </div>
          <div class="col-sm-4 text-sm-right mt-3 mt-sm-0">
            <button type="button" class="btn btn-primary" id="btnNewUnit">
              <i class="fas fa-plus mr-1"></i>Nueva unidad
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="content">
      <div class="container-fluid">
        <div class="row">
          <div class="col-lg-7">
            <div class="card border-0 shadow-sm">
              <div class="card-header">
                <div class="d-flex align-items-center justify-content-between">
                  <h3 class="card-title mb-0">Arbol territorial</h3>
                  <input type="search" class="form-control form-control-sm territorial-search" id="territorialSearch" placeholder="Buscar por nombre">
                </div>
              </div>
              <div class="card-body">
                <div id="territorialTree" class="territorial-tree"></div>
              </div>
            </div>
          </div>

          <div class="col-lg-5">
            <div class="card border-0 shadow-sm">
              <div class="card-header">
                <h3 class="card-title mb-0" id="territorialFormTitle">Nueva unidad territorial</h3>
              </div>
              <div class="card-body">
                <form id="territorialForm" novalidate>
                  <input type="hidden" id="territorialId">
                  <div class="form-group">
                    <label for="territorialName">Nombre</label>
                    <input type="text" class="form-control" id="territorialName" maxlength="120" required>
                  </div>
                  <div class="form-group">
                    <label for="territorialType">Tipo</label>
                    <select class="form-control" id="territorialType" required>
                      <option value="province">Provincia</option>
                      <option value="canton">Canton</option>
                      <option value="parish">Parroquia</option>
                      <option value="sector">Sector / Barrio</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label for="territorialParent">Unidad padre</label>
                    <select class="form-control" id="territorialParent"></select>
                    <small class="form-text text-muted">La lista se filtra segun el tipo seleccionado.</small>
                  </div>
                  <div class="form-group">
                    <label for="territorialCode">Codigo</label>
                    <input type="text" class="form-control" id="territorialCode" maxlength="60">
                  </div>
                  <div class="custom-control custom-switch mb-3">
                    <input type="checkbox" class="custom-control-input" id="territorialActive" checked>
                    <label class="custom-control-label" for="territorialActive">Activo</label>
                  </div>
                  <div class="d-flex justify-content-between">
                    <button type="button" class="btn btn-outline-secondary" id="btnResetUnit">Limpiar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="main-footer text-sm">
    <strong>Sistema de Gestion de Incidencias Georreferenciadas (SGI)</strong>
  </footer>
</div>

<script src="../../plugins/jquery/jquery.min.js"></script>
<script src="../../plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="../../plugins/overlayScrollbars/js/jquery.overlayScrollbars.min.js"></script>
<script src="../../dist/js/adminlte.min.js"></script>
<script type="module" src="../js/layout/layout.js?v=20"></script>
<script type="module" src="../js/modules/territorial-units/presentation/territorial-units-page.js?v=2"></script>
</body>
</html>
