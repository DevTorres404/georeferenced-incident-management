<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SGI | Mapa de incidencias</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <meta name="description" content="Visualización georreferenciada de incidencias registradas">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <link rel="stylesheet" href="/plugins/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="/plugins/overlayScrollbars/css/OverlayScrollbars.min.css">
    <link rel="stylesheet" href="/dist/css/adminlte.min.css">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" integrity="sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/app.css?v=63">
    <script src="/js/core/protected-page-guard.js?v=5"></script>
</head>

<body class="hold-transition sidebar-mini layout-fixed">
    <div class="wrapper">
        <div id="alertaGlobal" role="alert"></div>
        <nav class="main-header navbar navbar-expand navbar-white navbar-light" id="mainNavbar"></nav>
        <aside class="main-sidebar sidebar-dark-primary elevation-4"> <a href="dashboard.html"
                class="brand-link bg-transparent border-0 d-flex align-items-center" style="padding: 10px 15px;"> <img
                    src="/img/SGI_LOGO.png" alt="SGI Logo" class="brand-image"
                    style="opacity: .9; border-radius: 4px; object-fit: contain; width: 35px; height: 35px; background-color: white;">
                <span class="brand-text font-weight-bold ml-2 text-white" style="letter-spacing: 1px;">SGI</span> </a>
            <div id="mainSidebar"></div>
        </aside>
        <div class="content-wrapper">
            <div id="pageLoader" class="spinner-overlay" role="status" aria-live="polite">
                <div class="loader-orbit" aria-hidden="true"> <i class="fas fa-map-marker-alt"></i> </div>
            </div>
            <div class="content-header">
                <div class="container-fluid">
                    <div class="row mb-2">
                        <div class="col-sm-8">
                            <h1 class="m-0"> <i class="fas fa-map-marked-alt text-primary mr-2"></i>Mapa de incidencias
                            </h1>
                            <p class="text-muted mb-0 mt-1" style="font-size: 0.9rem;">Consulta la distribución
                                geográfica de incidencias registradas.</p>
                        </div>
                        <div class="col-sm-4 d-flex justify-content-sm-end align-items-center mt-3 mt-sm-0"> <span
                                class="badge badge-primary px-3 py-2" id="mapCounter">0 incidencias</span> </div>
                    </div>
                </div>
            </div>
            <div class="content">
                <div class="container-fluid">
                    <div class="card border-0 shadow-sm mb-3">
                        <div class="card-body">
                            <div class="row">
                                <div class="col-lg-3 col-md-6">
                                    <div class="form-group mb-lg-0"> <label for="mapSearch">Busqueda</label> <input
                                            type="search" class="form-control" id="mapSearch"
                                            placeholder="Código, título o dirección"> </div>
                                </div>
                                <div class="col-lg-2 col-md-6">
                                    <div class="form-group mb-lg-0"> <label for="mapState">Estado</label> <select
                                            class="form-control" id="mapState"></select> </div>
                                </div>
                                <div class="col-lg-2 col-md-6">
                                    <div class="form-group mb-lg-0"> <label for="mapPriority">Prioridad</label> <select
                                            class="form-control" id="mapPriority"></select> </div>
                                </div>
                                <div class="col-lg-2 col-md-6">
                                    <div class="form-group mb-lg-0"> <label for="mapCategory">Categoría</label> <select
                                            class="form-control" id="mapCategory"></select> </div>
                                </div>
                                <div class="col-lg-3"> <label class="d-block">Alcance</label>
                                    <div class="d-flex flex-wrap align-items-center">
                                        <div class="custom-control custom-checkbox mr-3" id="mapMineScope"> <input type="checkbox"
                                                class="custom-control-input" id="mapMine"> <label
                                                class="custom-control-label" for="mapMine">Mis reportes</label> </div>
                                        <div class="custom-control custom-checkbox" id="mapAssignedScope"> <input type="checkbox"
                                                class="custom-control-input" id="mapAssignedToMe"> <label
                                                class="custom-control-label" for="mapAssignedToMe">Asignadas a
                                                mí</label> </div>
                                    </div>
                                    <small class="form-text text-muted" id="mapScopeContext"></small>
                                    <div class="mt-2"> <button type="button" class="btn btn-primary btn-sm"
                                            id="btnMapFilters"> <i class="fas fa-filter mr-1"></i>Aplicar </button>
                                        <button type="button" class="btn btn-outline-secondary btn-sm"
                                            id="btnClearMapFilters"> Limpiar </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-xl-8">
                            <div class="card border-0 shadow-sm">
                                <div class="card-body p-0">
                                    <div id="incidentsMap" class="incidents-map" aria-label="Mapa de incidencias"></div>
                                </div>
                            </div>
                        </div>
                        <div class="col-xl-4 mt-3 mt-xl-0">
                            <div class="card border-0 shadow-sm incident-map-list-card">
                                <div class="card-header">
                                    <h3 class="card-title mb-0"> <i class="fas fa-list mr-2"></i>Incidencias ubicadas
                                    </h3>
                                </div>
                                <div class="list-group list-group-flush incident-map-list" id="mapIncidentList"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <footer class="main-footer text-sm">
            <div class="float-right d-none d-sm-inline"> Versión 1.0.0</div> <strong>Sistema de Gestión de Incidencias
                Georreferenciadas (SGI)</strong>
        </footer>
        <aside class="control-sidebar control-sidebar-dark"></aside>
    </div>
    <script src="/plugins/jquery/jquery.min.js"></script>
    <script src="/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/plugins/overlayScrollbars/js/jquery.overlayScrollbars.min.js"></script>
    <script src="/dist/js/adminlte.min.js"></script>
    <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js" integrity="sha384-5+cfbwT0iiub6VsQAdn6yz16nr6sDiQoHx6tm4O8OVYXHYOxcffFmCJBL0dgdvGp" crossorigin="anonymous"></script>
    <script type="module" src="/js/layout/layout.js?v=43"></script>
    <script type="module" src="/js/modules/map/presentation/incident-map-page.js?v=5"></script>
</body>

</html>
